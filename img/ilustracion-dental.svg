<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t">
  <title id="t">Ilustración de un diente sano y brillante</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e7"/>
      <stop offset="1" stop-color="#ece3d2"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3efe8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="300" fill="url(#bg)"/>

  <!-- Formas decorativas -->
  <circle cx="92" cy="246" r="120" fill="#b08d57" opacity="0.08"/>
  <circle cx="560" cy="40" r="96" fill="#14213d" opacity="0.05"/>
  <circle cx="320" cy="150" r="112" fill="#ffffff" opacity="0.55"/>
  <circle cx="320" cy="150" r="112" fill="none" stroke="#b08d57" stroke-width="1.2" stroke-dasharray="2 7" opacity="0.7"/>

  <!-- Diente -->
  <g transform="translate(320 152)">
    <path d="M-44 -78 C-70 -78 -84 -58 -84 -32 C-84 -6 -72 12 -66 40 C-60 70 -52 92 -38 92 C-22 92 -20 60 -14 40 C-10 28 -6 24 0 24 C6 24 10 28 14 40 C20 60 22 92 38 92 C52 92 60 70 66 40 C72 12 84 -6 84 -32 C84 -58 70 -78 44 -78 C24 -78 14 -68 0 -68 C-14 -68 -24 -78 -44 -78 Z"
          fill="url(#tooth)" stroke="#14213d" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Brillo -->
    <path d="M-56 -40 C-56 -54 -48 -62 -36 -62" fill="none" stroke="#b08d57" stroke-width="4" stroke-linecap="round"/>
    <!-- Sonrisa -->
    <path d="M-20 -8 C-12 4 12 4 20 -8" fill="none" stroke="#14213d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-22" cy="-28" r="4" fill="#14213d"/>
    <circle cx="22" cy="-28" r="4" fill="#14213d"/>
  </g>

  <!-- Destellos -->
  <g fill="#b08d57">
    <path d="M438 74 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 z"/>
    <path d="M196 92 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 z"/>
    <path d="M462 196 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity="0.8"/>
    <path d="M178 206 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z" opacity="0.7"/>
  </g>

  <!-- Cepillo de dientes -->
  <g transform="translate(470 248) rotate(-28)" opacity="0.9">
    <rect x="0" y="-5" width="120" height="10" rx="5" fill="#14213d"/>
    <rect x="96" y="-14" width="30" height="10" rx="2" fill="#ffffff" stroke="#14213d" stroke-width="2"/>
    <g stroke="#b08d57" stroke-width="2" stroke-linecap="round">
      <line x1="100" y1="-14" x2="100" y2="-22"/>
      <line x1="106" y1="-14" x2="106" y2="-22"/>
      <line x1="112" y1="-14" x2="112" y2="-22"/>
      <line x1="118" y1="-14" x2="118" y2="-22"/>
      <line x1="124" y1="-14" x2="124" y2="-22"/>
    </g>
  </g>
</svg>
